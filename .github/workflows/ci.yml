name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Electron needs a display server on the runner, and --no-sandbox because
      # unprivileged user namespaces are not available there. Both live in the
      # test:ci script so the local `npm test` stays untouched.
      - name: Install xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - run: npm run test:ci
